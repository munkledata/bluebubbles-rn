name: Android

# Native inputs only: the clean prebuild, local native modules, APK and AAB take 50 to 85 minutes
# because React Native and Hermes compile from source, so this runs when something that reaches the
# native build changes, on the weekly schedule, and on demand. The emulator database lanes follow
# every successful build.
on:
  push:
    branches: [master, main, development, 'ci/**']
    paths:
      - 'android/**'
      - 'modules/**'
      - 'plugins/**'
      - 'patches/**'
      - 'app.config.ts'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - 'eas.json'
      - 'scripts/check-android-*.mjs'
      - 'scripts/legal-aab-inventory.mjs'
      - 'scripts/run-android-db-*.mjs'
      - 'scripts/run-android-db-ci.sh'
      - 'scripts/android-native-path-init.mjs'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'modules/**'
      - 'plugins/**'
      - 'patches/**'
      - 'app.config.ts'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - 'eas.json'
      - 'scripts/check-android-*.mjs'
      - 'scripts/legal-aab-inventory.mjs'
      - 'scripts/run-android-db-*.mjs'
      - 'scripts/run-android-db-ci.sh'
      - 'scripts/android-native-path-init.mjs'
      - '.github/workflows/android.yml'
  schedule:
    # Weekly Tuesday 07:17 UTC (01:17 America/Denver while daylight saving is active).
    # Use a non-zero minute to reduce GitHub scheduler congestion.
    - cron: '17 7 * * 2'
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight build of the same ref; scheduled and manual runs finish.
concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  android:
    name: Clean Android prebuild · native modules · APK + AAB
    runs-on: ubuntu-latest
    # React Native and Hermes compile from source (buildReactNativeFromSource keeps the reviewed
    # react-native patch) in their own included Gradle build, which ignores the app's
    # gradle.properties. Without the -PreactNativeArchitectures flags on the packaging steps it
    # compiled all four ABIs and ran past two hours; with them, the debug APK builds the
    # development ABIs and the release AAB only the shipped arm64-v8a.
    timeout-minutes: 120
    env:
      GRADLE_USER_HOME: /var/tmp/gator-gradle
      CFLAGS: >-
        -ffile-prefix-map=${{ github.workspace }}=/gator/source
        -fdebug-prefix-map=${{ github.workspace }}=/gator/source
        -ffile-prefix-map=/var/tmp/gator-gradle=/gator/gradle
        -fdebug-prefix-map=/var/tmp/gator-gradle=/gator/gradle
      CXXFLAGS: >-
        -ffile-prefix-map=${{ github.workspace }}=/gator/source
        -fdebug-prefix-map=${{ github.workspace }}=/gator/source
        -ffile-prefix-map=/var/tmp/gator-gradle=/gator/gradle
        -fdebug-prefix-map=/var/tmp/gator-gradle=/gator/gradle
      ASMFLAGS: >-
        -ffile-prefix-map=${{ github.workspace }}=/gator/source
        -fdebug-prefix-map=${{ github.workspace }}=/gator/source
        -ffile-prefix-map=/var/tmp/gator-gradle=/gator/gradle
        -fdebug-prefix-map=/var/tmp/gator-gradle=/gator/gradle
      GATOR_NATIVE_PATH_MAP_FLAGS: >-
        -ffile-prefix-map=${{ github.workspace }}=/gator/source
        -fdebug-prefix-map=${{ github.workspace }}=/gator/source
        -ffile-prefix-map=/var/tmp/gator-gradle=/gator/gradle
        -fdebug-prefix-map=/var/tmp/gator-gradle=/gator/gradle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify toolchain pins
        run: node scripts/check-toolchain.mjs

      # No `cache: gradle`: setup-java caches only ~/.gradle, but this job's Gradle home is the
      # path-mapped /var/tmp/gator-gradle above, so that cache never restored or saved anything.
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      # The Gradle home above, keyed by the inputs that change what Gradle downloads or compiles.
      # android/** is generated by the prebuild below, so it must not be part of the key.
      - name: Restore Gradle caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /var/tmp/gator-gradle/caches
            /var/tmp/gator-gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'patches/*.patch', 'app.config.ts', 'plugins/**', 'eas.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install pinned Android SDK inputs
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci

      - name: Clean Expo prebuild
        env:
          # Compile-only sentinel. Release builds require the restricted production key.
          GOOGLE_MAPS_ANDROID_API_KEY: AIzaAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          GOOGLE_SERVICES_JSON: ./test/fixtures/google-services.ci.json
        run: ./node_modules/.bin/expo prebuild --platform android --clean --no-install

      - name: Scan generated Android diagnostics
        run: npm run check:error-diagnostics

      - name: Verify Expo module discovery
        run: ./node_modules/.bin/expo-modules-autolinking search -p android

      - name: Install native path-map Gradle hook
        run: node scripts/android-native-path-init.mjs

      # Keep packaging variants in separate Gradle invocations. A combined assembleDebug +
      # bundleRelease run has intermittently failed inside PackageAndroidArtifact's incremental
      # splitter even though each isolated task succeeds against the same compiled inputs.
      - name: Compile local native modules
        working-directory: android
        run: >-
          ./gradlew
          :gator-paste-input:compileDebugKotlin
          :gator-share-shortcuts:compileDebugKotlin
          :gator-share-intake:compileDebugKotlin
          :gator-bounded-document:compileDebugKotlin
          :gator-bounded-download:compileDebugKotlin
          :gator-screen-security:compileDebugKotlin
          :gator-power:compileDebugKotlin
          --no-daemon

      - name: Test local native modules
        working-directory: android
        run: >-
          ./gradlew
          :gator-paste-input:testDebugUnitTest
          :gator-share-shortcuts:testDebugUnitTest
          :gator-share-intake:testDebugUnitTest
          :gator-bounded-document:testDebugUnitTest
          :gator-bounded-download:testDebugUnitTest
          :expo-file-system:testDebugUnitTest
          :expo-task-manager:testDebugUnitTest
          :expo-background-task:testDebugUnitTest
          :react-native-screens:testDebugUnitTest
          --no-daemon

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon

      - name: Bundle release AAB
        working-directory: android
        run: ./gradlew :app:bundleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Verify Android native path hygiene
        run: npm run check:android-native-paths

      - name: Verify debug/release manifests, release AAB, and headless entry
        run: npm run check:android-build

      - name: Retain debug APK for the database lanes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-db-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

  android-db:
    name: Android DB lanes · API 36 x86_64
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The emulator lanes are informational until the wal-write-death lane is stable: it failed on
    # master's weekly schedule on 2026-11-03 (marker timeout) and 2026-10-06 (process identity) and
    # here on 2026-11-06 (no process within the launch window). The build job above stays blocking;
    # a red lane is still visible on the run page and in its retained report artifact.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify toolchain pins
        run: node scripts/check-toolchain.mjs

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Download reviewed debug APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-db-debug-apk
          path: android/app/build/outputs/apk/debug

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run real Android database lanes
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ANDROID_SERIAL: emulator-5554
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-port: 5554
          disable-animations: true
          script: bash scripts/run-android-db-ci.sh

      - name: Retain privacy-safe Android database reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-db-reports
          path: |
            android/app/build/reports/db-contract/android-db-contract-*.json
            android/app/build/reports/db-relaunch/android-db-relaunch-*.json
            android/app/build/reports/db-wal-write-death/android-db-wal-write-death-*.json
            android/app/build/reports/db-active-migration-death/android-db-active-migration-death-*.json
          if-no-files-found: error
          retention-days: 90
