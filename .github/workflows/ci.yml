name: CI

on:
  push:
    branches: [master, main, development]
  pull_request:
  schedule:
    # Weekly Tuesday 07:17 UTC (01:17 America/Denver while daylight saving is active).
    # Use a non-zero minute to reduce GitHub scheduler congestion.
    - cron: '17 7 * * 2'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Block newly introduced high-risk dependencies
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  check:
    name: Typecheck · Format · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The secret-hygiene guard intentionally scans repository history.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Workflow supply-chain guard
        shell: bash
        run: |
          node --test scripts/check-workflow-security.test.mjs
          node scripts/check-workflow-security.mjs

      - name: Test toolchain policy
        run: node --test scripts/check-toolchain.test.mjs scripts/release-android.test.mjs

      - name: Verify toolchain pins
        run: node scripts/check-toolchain.mjs

      - name: Install dependencies
        run: npm ci

      - name: Database write approval guard
        run: node scripts/check-db-writes.mjs --check

      - name: Audit clean lockfile (all dependencies)
        run: npm audit --audit-level=high

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Architecture and secret hygiene guards
        run: |
          npm run check:architecture
          npm run check:secret-hygiene
          npm run check:error-diagnostics

      - name: Expo dependency health
        run: |
          npm run doctor
          ./node_modules/.bin/expo install --check

      - name: Production Expo export
        env:
          GOOGLE_SERVICES_JSON: ./test/fixtures/google-services.ci.json
        run: ./node_modules/.bin/expo export --platform android --output-dir dist-ci

      - name: Typecheck
        run: npm run typecheck

      - name: Migration allocation guard
        run: npm run check:migrations

      - name: Lint (ESLint — react-hooks)
        run: npm run lint

      - name: Prettier (check)
        run: npm run format:check

      - name: Guard dev fixtures behind __DEV__
        run: |
          set -e
          # The dev-fixture origin must only appear in __DEV__-gated entry points.
          STRAY=$(grep -rln "dev.local" src app --include='*.ts' --include='*.tsx' \
                    | grep -vE 'utils/isDev\.ts|welcome\.tsx' || true)
          if [ -n "$STRAY" ]; then
            echo "::error::'dev.local' referenced outside the known __DEV__-gated files:"; echo "$STRAY"
            exit 1
          fi

      - name: Unit tests and UI coverage gate
        run: npm run coverage:ui -- --ci --runInBand

  android:
    name: Clean Android prebuild · native modules · APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify toolchain pins
        run: node scripts/check-toolchain.mjs

      - name: Set up Java
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install pinned Android SDK inputs
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci

      - name: Clean Expo prebuild
        env:
          GOOGLE_SERVICES_JSON: ./test/fixtures/google-services.ci.json
        run: ./node_modules/.bin/expo prebuild --platform android --clean --no-install

      - name: Scan generated Android diagnostics
        run: npm run check:error-diagnostics

      - name: Verify Expo module discovery
        run: ./node_modules/.bin/expo-modules-autolinking search -p android

      # Keep packaging variants in separate Gradle invocations. A combined assembleDebug +
      # bundleRelease run has intermittently failed inside PackageAndroidArtifact's incremental
      # splitter even though each isolated task succeeds against the same compiled inputs.
      - name: Compile local native modules
        working-directory: android
        run: >-
          ./gradlew
          :gator-paste-input:compileDebugKotlin
          :gator-share-shortcuts:compileDebugKotlin
          :gator-bounded-download:compileDebugKotlin
          :gator-screen-security:compileDebugKotlin
          --no-daemon

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Bundle release AAB
        working-directory: android
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Verify debug/release manifests, release AAB, and headless entry
        run: npm run check:android-build

      - name: Retain debug APK for scheduled database checks
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-android-db-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

  android-db:
    name: Scheduled Android DB · API 36 x86_64
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify toolchain pins
        run: node scripts/check-toolchain.mjs

      - name: Set up Java
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Download reviewed debug APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scheduled-android-db-debug-apk
          path: android/app/build/outputs/apk/debug

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run real Android database lanes
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ANDROID_SERIAL: emulator-5554
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-port: 5554
          disable-animations: true
          script: bash scripts/run-android-db-ci.sh

      - name: Retain privacy-safe Android database reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-android-db-reports
          path: |
            android/app/build/reports/db-contract/android-db-contract-*.json
            android/app/build/reports/db-relaunch/android-db-relaunch-*.json
            android/app/build/reports/db-wal-write-death/android-db-wal-write-death-*.json
            android/app/build/reports/db-active-migration-death/android-db-active-migration-death-*.json
          if-no-files-found: error
          retention-days: 14
