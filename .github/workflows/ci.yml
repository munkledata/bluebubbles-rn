name: CI

# Every push and pull request: the host-side gates only. Native builds live in android.yml and
# upstream drift checks (Expo patches, expo-doctor) in drift.yml, so this workflow stays short and a
# newer push cancels only its own superseded run.
on:
  push:
    branches: [master, main, development, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Block newly introduced high-risk dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  check:
    name: Typecheck · Format · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secret-hygiene guard intentionally scans repository history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Workflow supply-chain guard
        shell: bash
        run: |
          node --test scripts/check-workflow-security.test.mjs
          node scripts/check-workflow-security.mjs

      - name: Test toolchain policy
        run: node --test scripts/check-toolchain.test.mjs scripts/release-android.test.mjs

      - name: Verify toolchain pins
        run: node scripts/check-toolchain.mjs

      - name: Install dependencies
        run: npm ci

      - name: Smoke controlled environment config resolution
        run: node scripts/check-toolchain.mjs --environment-smoke

      - name: Architecture and secret hygiene guards
        run: |
          npm run check:architecture
          npm run check:secret-hygiene
          npm run check:error-diagnostics

      - name: Production Expo export
        env:
          GOOGLE_SERVICES_JSON: ./test/fixtures/google-services.ci.json
        run: ./node_modules/.bin/expo export --platform android --output-dir dist-ci

      - name: Typecheck
        run: npm run typecheck

      # Jest only transpiles tests (isolatedModules), so this is what fails a test's type error.
      - name: Typecheck tests
        run: npm run typecheck:tests

      # A dependency, patch, local module or plugin change must regenerate the legal inventory.
      # Neither workflow checked it before, and a stale inventory landed twice (2026-11-05, -11-06).
      - name: Legal inventory
        run: npm run check:legal-inventory

      - name: Migration allocation guard
        run: npm run check:migrations

      - name: Lint (ESLint — react-hooks)
        run: npm run lint

      - name: Prettier (check)
        run: npm run format:check

      - name: Guard dev fixtures behind __DEV__
        run: |
          set -e
          # The dev-fixture origin must only appear in __DEV__-gated entry points.
          STRAY=$(grep -rln "dev.local" src app --include='*.ts' --include='*.tsx' \
                    | grep -vE 'utils/isDev\.ts|welcome\.tsx' || true)
          if [ -n "$STRAY" ]; then
            echo "::error::'dev.local' referenced outside the known __DEV__-gated files:"; echo "$STRAY"
            exit 1
          fi

      - name: Unit tests and UI coverage gate
        # Two workers instead of a single band (C-5). Measured 2026-11-06: three consecutive runs
        # (42301536330, 42303427347, 42304548524) printed totals identical to master's --runInBand
        # run, so the dual instrumentation of files both Jest projects load does not make the merged
        # numbers order-dependent at this worker count. Re-measure before raising it further.
        run: npm run coverage:ui -- --ci --maxWorkers=2

      # Runs last so a newly published advisory cannot stop the code checks above from running,
      # while a high or critical advisory without a reviewed, unexpired exception still fails CI.
      # Expo patch drift (expo-doctor, expo install --check) moved to drift.yml: it is upstream
      # churn, not a property of the push.
      - name: Dependency audit (reviewed exceptions only)
        run: |
          node --test scripts/check-npm-audit.test.mjs
          node scripts/check-npm-audit.mjs
