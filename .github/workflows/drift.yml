name: Upstream drift

# Checks that go red because of upstream releases alone (an Expo patch, expo-doctor's directory
# data, a newly published advisory). They never block a push; they run daily and on demand.
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Expo dependency health · npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify toolchain pins
        run: node scripts/check-toolchain.mjs

      - name: Install dependencies
        run: npm ci

      - name: Expo dependency health
        run: |
          npm run doctor
          ./node_modules/.bin/expo install --check

      - name: Dependency audit (reviewed exceptions only)
        run: |
          node --test scripts/check-npm-audit.test.mjs
          node scripts/check-npm-audit.mjs
