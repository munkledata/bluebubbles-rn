version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Denver
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    ignore:
      # Pinned exactly by scripts/check-toolchain.mjs or carrying a local patches/ file. Upgrade
      # these by hand, moving the pin or re-basing the patch in the same change.
      - dependency-name: '@op-engineering/op-sqlite'
      - dependency-name: '@react-native-firebase/*'
      - dependency-name: '@shopify/flash-list'
      - dependency-name: 'drizzle-orm'
      - dependency-name: 'expo-background-task'
      - dependency-name: 'expo-file-system'
      - dependency-name: 'expo-router'
      - dependency-name: 'expo-task-manager'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-libsodium'
      - dependency-name: 'react-native-maps'
      - dependency-name: 'react-native-notify-kit'
      - dependency-name: 'react-native-screens'
      # Peer-locked to react-native 0.86 / Expo SDK 57; a bump outside `npx expo install` breaks
      # the native build or the worklets runtime.
      - dependency-name: '@react-native-community/datetimepicker'
      - dependency-name: 'react-native-reanimated'
      - dependency-name: 'react-native-safe-area-context'
      - dependency-name: 'react-native-worklets'
      # A new Expo SDK (or React) major is a coordinated `npx expo install` upgrade, not a bump.
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jest-expo'
        update-types: ['version-update:semver-major']
      # React must match the renderer bundled with react-native; it moves only with the SDK.
      - dependency-name: 'react'
    groups:
      expo-sdk:
        patterns:
          - '@expo/*'
          - 'expo'
          - 'expo-*'
          - 'jest-expo'
      react-native-runtime:
        patterns:
          - '@react-native-*'
          - 'react'
          - 'react-native'
          - 'react-native-*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:15'
      timezone: America/Denver
    open-pull-requests-limit: 5
