plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.gator.pasteinput'
version = '0.1.0'

// androidx.core (ViewCompat.setOnReceiveContentListener / ContentInfoCompat, both added in core
// 1.7) is on the classpath transitively: expo-modules-core exposes `api "androidx.core:core-ktx"`
// (currently 1.17.0), so no explicit dependency is needed — same as gator-share-shortcuts.
android {
  namespace "expo.modules.gatorpasteinput"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
